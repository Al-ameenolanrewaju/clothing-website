<article class="product-card luxury-product-card" data-product-card
  data-product-id="{{ product.id }}" data-product-name="{{ product.name }}" data-product-price="{{ product.price }}"
  data-product-description="{{ product.description or '' }}">
  <a class="product-card-image-link" href="{{ url_for('storefront.collection') }}">
    <div class="product-photo">
      {% set cover_image = product.images|sort(attribute="sort_order")|first %}
      {% if cover_image %}<img src="{{ cover_image.url }}" alt="{{ cover_image.alt_text or product.name }}" loading="lazy">
      {% else %}<div class="fashion-placeholder"><span>Photo coming soon</span></div>{% endif %}
      <span class="product-favourite" aria-hidden="true">♡</span>
    </div>
  </a>
  <div class="luxury-product-info">
    <h3>{{ product.name }}</h3>
    <p class="luxury-price">₦{{ "{:,.0f}".format(product.price) }}</p>
    <button class="product-whatsapp-button add-to-cart-button" type="button" data-add-to-cart aria-pressed="false"><span aria-hidden="true">🛒</span> Add to Cart</button>
  </div>
</article>
